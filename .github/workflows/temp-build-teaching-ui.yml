name: Temp build teaching UI
on:
  push:
    branches: [chatgpt/teaching-window-v2]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/teaching-window-v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tools/package-lock.json
      - run: npm --prefix tools ci
      - run: npm --prefix tools run pack
      - name: Commit generated bundle
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add spatial-lab.js Groq_TSP_交互讲解.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "重新打包教学窗口 [skip ci]"
          git push origin HEAD:chatgpt/teaching-window-v2
